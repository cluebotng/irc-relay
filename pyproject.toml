[project]
name = "irc-relay"
requires-python = ">=3.12" # T408108
dependencies = [
    "bottom (>=3.0.0,<4.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
]

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"
bandit = "^1.9.4"
pytest = "^9.2.0"
freezegun = "^1.5.5"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
